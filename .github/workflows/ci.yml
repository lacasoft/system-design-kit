name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Validar integridad del kit
        run: node scripts/validate.cjs
      - name: Tests (helper e instalador)
        run: node --test
      - name: Smoke test del instalador (es y en)
        run: |
          set -e
          for lang in es en; do
            tmp="$(mktemp -d)"
            ( cd "$tmp" && node "$GITHUB_WORKSPACE/install.js" --yes --lang "$lang" --title "Smoke" >/dev/null && node .claude/helpers/design-status.cjs >/dev/null )
            rm -rf "$tmp"
          done
          echo "✅ instalador OK en es y en"

  pi:
    # La capa de Pi dentro de Pi real, con su proveedor simulado: sin modelo ni API key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # Pi 1.4.0 pide Node >= 22.19
      - name: Instalar Pi 1.4.0 (versión fija, sin scripts)
        run: npm install --prefix "$RUNNER_TEMP/pi" --no-save --save-exact --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
      - name: Integración con Pi
        env:
          PI_BIN: ${{ runner.temp }}/pi/node_modules/.bin/pi
        run: node --test test/pi.test.cjs
